server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;   # backend accepts uploads up to 20MB file / 25MB request

    # API -> upgraded backend published on host port 8081 (capstone-debug)
    location /api/ {
        resolver 127.0.0.11 valid=10s;   # Docker DNS: re-resolve if the backend container restarts
        set $backend http://host.docker.internal:8081;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Same-origin via proxy: drop Origin so Spring's CORS check does not reject it (same as the Vite dev proxy)
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        # Server-Sent Events / long requests
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets: cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every other route -> index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
